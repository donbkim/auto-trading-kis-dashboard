<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Index Trend Paper Dashboard</title>
  <style>
    :root { color-scheme: dark light; --bg:#0b1220; --surface:#121c2e; --surface-2:#19263c; --line:#2b3a52; --text:#eff5ff; --muted:#9bacbf; --good:#35d39e; --bad:#ff6b7e; --accent:#75a7ff; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:22px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; }
    main { width:min(100%,760px); margin:auto; padding:20px 16px calc(28px + env(safe-area-inset-bottom)); } header { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:18px; }
    h1 { font-size:30px; line-height:1.15; margin:0 0 6px; } h2 { font-size:25px; margin:30px 0 12px; } p { margin:0; } .eyebrow,.muted { color:var(--muted); font-size:20px; }.refresh { min-height:52px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--text); padding:0 16px; font-size:21px; font-weight:800; cursor:pointer; }
    .tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; }.tab { min-height:54px; border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:10px; font-size:22px; font-weight:850; cursor:pointer; }.tab[aria-selected="true"] { background:#253b65; border-color:var(--accent); color:#fff; }
    .summary { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:14px; }.metric { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; }.metric .label { color:var(--muted); font-size:20px; }.metric .value { margin-top:4px; font-size:24px; font-weight:900; }.metric .value small { color:var(--muted); font-size:20px; font-weight:800; }.positive { color:var(--good)!important; }.negative { color:var(--bad)!important; }
    .notice { margin-top:12px; padding:14px; border-radius:10px; background:#2f2540; border:1px solid #634773; color:#f0d7ff; }.card { border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:16px; margin:10px 0; }.position-top,.row { display:flex; justify-content:space-between; gap:14px; align-items:flex-start; }.symbol { font-size:25px; font-weight:900; }.name { color:var(--muted); font-size:21px; margin-top:3px; }.sector { display:inline-block; margin-top:8px; padding:4px 8px; border-radius:99px; color:#c9d9f6; background:#202f4a; font-size:19px; }.return { font-size:26px; font-weight:950; text-align:right; white-space:nowrap; }.spark { width:100%; height:112px; margin-top:16px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--surface-2); border-radius:8px; overflow:hidden; }.spark svg { display:block; width:100%; height:100%; }.spark text { font-size:18px; fill:var(--muted); font-weight:850; }.spark-line { fill:none; stroke:currentColor; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }.spark-base { stroke:var(--line); stroke-width:2; stroke-dasharray:5 5; }.spark-fill { opacity:.12; }.detail { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }.detail span { color:var(--muted); font-size:19px; display:block; }.detail strong { display:block; font-size:22px; margin-top:2px; }.closed { padding:14px 0; border-bottom:1px solid var(--line); }.closed strong { font-size:24px; }.closed:last-child { border-bottom:0; }.empty,.error { text-align:center; padding:30px 16px; color:var(--muted); background:var(--surface); border:1px dashed var(--line); border-radius:12px; }.error { color:#ffd4da; border-color:#7b3c4a; } .hidden { display:none!important; }
    @media (min-width:600px) { main{padding-top:32px}.summary{grid-template-columns:repeat(4,minmax(0,1fr));}.detail{grid-template-columns:repeat(4,minmax(0,1fr));} }
    @media (prefers-color-scheme: light) { :root{--bg:#f5f8fc;--surface:#fff;--surface-2:#eef4fb;--line:#d6e0ec;--text:#162235;--muted:#607088;--accent:#275fd1;} .tab[aria-selected="true"]{background:#e5efff;color:#133a8a}.sector{background:#e9f0fb;color:#304d77}.notice{background:#fff6dd;border-color:#eccd79;color:#755515} }
  </style>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">독립 Paper Strategy</p><h1>섹터 우세 종목 투자 전략</h1><p id="updated" class="muted">데이터를 불러오는 중입니다.</p></div><button id="refresh" class="refresh" type="button">새로고침</button></header>
    <div class="tabs" role="tablist" aria-label="시장 선택"><button class="tab" data-market="domestic" role="tab" aria-selected="true">국내</button><button class="tab" data-market="oversea" role="tab" aria-selected="false">해외</button></div>
    <section id="content" aria-live="polite"></section>
  </main>
  <script src="config.js"></script>
  <script>
    (() => {
      const content = document.querySelector('#content'), updated = document.querySelector('#updated');
      let snapshot = null, activeMarket = 'domestic';
      const config = window.DASHBOARD_CONFIG || {};
      const money = (value, currency) => value == null ? '—' : new Intl.NumberFormat('ko-KR', {style:'currency',currency,maximumFractionDigits:currency === 'KRW' ? 0 : 2}).format(value);
      const pct = value => value == null ? '—' : `${value >= 0 ? '+' : ''}${Number(value).toFixed(2)}%`;
      const tone = value => value == null ? '' : value >= 0 ? 'positive' : 'negative';
      const escaped = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      const date = value => { if (!value) return '—'; const parsed = new Date(value); return Number.isNaN(parsed) ? value : new Intl.DateTimeFormat('ko-KR',{dateStyle:'short',timeStyle:'short',timeZone:'Asia/Seoul'}).format(parsed); };
      function metric(label, value, className = '') { return `<div class="metric"><span class="label">${label}</span><div class="value ${className}">${value}</div></div>`; }
      function sparkline(position) {
        const history = Array.isArray(position.history) ? position.history.filter(point => Number.isFinite(Number(point.return_pct))) : [];
        if (history.length < 2) return '';
        const values = history.map(point => Number(point.return_pct));
        let min = Math.min(...values, 0), max = Math.max(...values, 0);
        if (min === max) { min -= 1; max += 1; }
        const x = index => 14 + (index * 332 / Math.max(1, values.length - 1));
        const y = value => 82 - ((value - min) * 58 / (max - min));
        const line = values.map((value, index) => `${index ? 'L' : 'M'}${x(index).toFixed(1)} ${y(value).toFixed(1)}`).join(' ');
        const fill = `${line} L346 96 L14 96 Z`;
        const baseY = y(0).toFixed(1);
        const start = history[0], end = history[history.length - 1];
        return `<div class="spark ${tone(position.unrealized_return_pct)}" aria-label="진입 기준 수익률 추이"><svg viewBox="0 0 360 112" role="img"><path class="spark-fill" d="${fill}" fill="currentColor"></path><line class="spark-base" x1="14" y1="${baseY}" x2="346" y2="${baseY}"></line><path class="spark-line" d="${line}"></path><circle cx="${x(values.length - 1).toFixed(1)}" cy="${y(values[values.length - 1]).toFixed(1)}" r="5" fill="currentColor"></circle><text x="14" y="20">${escaped(start.date)}</text><text x="346" y="20" text-anchor="end">${escaped(end.date)} · ${pct(end.return_pct)}</text></svg></div>`;
      }
      function positionCard(position, currency) {
        return `<article class="card"><div class="position-top"><div><div class="symbol">${escaped(position.symbol)}</div><div class="name">${escaped(position.name)}</div><span class="sector">${escaped(position.sector)}</span></div><div class="return ${tone(position.unrealized_return_pct)}">${pct(position.unrealized_return_pct)}</div></div>${sparkline(position)}<div class="detail"><div><span>평균매입가</span><strong>${money(position.entry_price, currency)}</strong></div><div><span>최신가</span><strong>${money(position.latest_price, currency)}</strong></div><div><span>평가금액</span><strong>${money(position.market_value, currency)}</strong></div><div><span>수량</span><strong>${escaped(position.shares)}</strong></div></div></article>`;
      }
      function render() {
        const market = snapshot && snapshot.markets && snapshot.markets[activeMarket];
        document.querySelectorAll('.tab').forEach(tab => tab.setAttribute('aria-selected', String(tab.dataset.market === activeMarket)));
        if (!market) { content.innerHTML = '<div class="empty">표시할 시장 데이터가 없습니다.</div>'; return; }
        const s = market.summary, positions = market.positions || [], closed = market.closed_positions || [];
        updated.textContent = `기준: ${date(snapshot.generated_at)} · ${market.label} · ${snapshot.version ? `v${snapshot.version}` : ''}`;
        content.innerHTML = `${s.universe_stale ? '<div class="notice">유니버스 스냅샷이 오래되었습니다. 신규 진입은 제한된 상태일 수 있습니다.</div>' : ''}
          <div class="summary">${metric('전략 수익률', pct(s.total_return_pct), tone(s.total_return_pct))}${metric('벤치마크 대비', pct(s.excess_return_pct), tone(s.excess_return_pct))}${metric('평가금액', money(s.total_equity, market.currency))}${metric('현금 / 보유', `${money(s.cash, market.currency)}<br><small>${s.holding_count}종목 보유</small>`)}</div>
          <h2>보유 종목 · 평가수익률</h2>${positions.length ? positions.map(position => positionCard(position, market.currency)).join('') : '<div class="empty">현재 보유 종목이 없습니다.</div>'}
          <h2>최근 청산</h2>${closed.length ? `<div class="card">${closed.map(item => `<div class="closed row"><div><strong>${escaped(item.symbol)}</strong><div class="name">${escaped(item.name)} · ${escaped(item.exit_reason || '청산')}</div><div class="muted">${date(item.exited_at)} · ${escaped(item.shares)}주</div></div><strong class="${tone(item.realized_return_pct)}">${pct(item.realized_return_pct)}</strong></div>`).join('')}</div>` : '<div class="empty">최근 청산 이력이 없습니다.</div>'}`;
      }
      function fail(message) { updated.textContent = '데이터를 불러오지 못했습니다.'; content.innerHTML = `<div class="error">${escaped(message)}</div>`; }
      function load() {
        if (!config.endpoint || config.endpoint.includes('REPLACE_')) { fail('config.js에 Apps Script /exec URL을 설정하세요.'); return; }
        const callback = `dashboardCallback_${Date.now()}`;
        window[callback] = data => { delete window[callback]; document.getElementById(callback)?.remove(); if (data && data.ok) { snapshot = data; render(); } else fail('API가 대시보드 데이터를 반환하지 않았습니다.'); };
        const script = document.createElement('script'); script.id = callback; script.src = `${config.endpoint}?view=dashboard&callback=${callback}&_=${Date.now()}`; script.onerror = () => { delete window[callback]; fail('Apps Script API에 연결할 수 없습니다.'); }; document.head.append(script);
      }
      document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => { activeMarket = tab.dataset.market; render(); }));
      document.querySelector('#refresh').addEventListener('click', load); load(); setInterval(load, 60000);
    })();
  </script>
</body>
</html>
